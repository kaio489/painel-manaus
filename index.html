function bounds(){let start=anchor,end=anchor;const a=new Date(anchor+'T12:00:00Z');if(range==='mes'){start=anchor.slice(0,7)+'-01';end=new Date(Date.UTC(a.getUTCFullYear(),a.getUTCMonth()+1,0)).toISOString().slice(0,10);}else if(range==='semana'){const n=(a.getUTCDay()+6)%7;a.setUTCDate(a.getUTCDate()-n);start=a.toISOString().slice(0,10);a.setUTCDate(a.getUTCDate()+6);end=a.toISOString().slice(0,10);}else if(range==='todos'){start='0000-01-01';end='9999-12-31';}return {start,end};}
const within=s=>{const b=bounds();return s>=b.start&&s<=b.end;};

function dashboard(){const os=periodOrders(),sold=os.reduce((s,o)=>s+gross(o),0),cash=D.receipts.filter(x=>within(x.day)).reduce((s,x)=>s+number(x.amount),0),pending=validOrders().filter(o=>!['Concluído'].includes(o.status)),low=D.stock.filter(x=>+x.quantity<=+x.minimum);return controls()+`<div class="mf-cards">${metric('Vendas no período',R(sold),os.length+' pedidos')}${metric('Entradas no período',R(cash),'Valores efetivamente recebidos')}${metric('Em andamento',pending.length,'Novos, produção e entregas')}${metric('A receber',R(validOrders().reduce((s,o)=>s+dueTotal(o),0)),overdue().length+' parcelas vencidas')}<\/div>`+box('Pedidos mais recentes',D.orders.length?ordersRows(D.orders.slice(0,6)):empty('Sua loja está pronta','Pedidos finalizados no site aparecerão aqui.'),btn('+ Venda manual','new-order','',true))+`<div class="mf-two">${box('Agenda de hoje',validOrders().filter(o=>o.data.periodo_data===today()).length?'<div class="mf-list">'+validOrders().filter(o=>o.data.periodo_data===today()).map(o=>`<div class="mf-list-row"><span><b>#MF-${o.id}<\/b> · ${E(o.data.c)}<br>${E(o.data.e)} · ${o.data.periodo==='manha'?'Manhã':'Tarde'}<\/span>${badge(o.status)}<\/div>`).join('')+'<\/div>':empty('Agenda livre','Nenhum pedido agendado para hoje.'))}${box('Atenção da loja','<div class="mf-list"><div class="mf-list-row"><span>Parcelas vencidas<\/span><b>'+overdue().length+'<\/b><\/div><div class="mf-list-row"><span>Itens no estoque mínimo<\/span><b>'+low.length+'<\/b><\/div><div class="mf-list-row"><span>Produtos cadastrados<\/span><b>'+D.products.length+'<\/b><\/div><\/div>')}<\/div>`;}
function orders(){let list=D.orders.filter(o=>within(dayOf(o.created_at)));if(tab==='producao')list=validOrders().filter(o=>['Confirmado','Em produção','Pronto'].includes(o.status));if(tab==='entregas')list=validOrders().filter(o=>o.data.e==='Entrega'&&(filter||o.status!=='Concluído'));if(filter)list=list.filter(o=>o.status===filter);if(query){const q=query.toLowerCase();list=list.filter(o=>(o.id+' '+o.data.c+' '+o.data.t+' '+o.data.a).toLowerCase().includes(q));}return (tab==='pedidos'?controls(true):`<p class="mf-note">${tab==='producao'?'Pedidos confirmados, em produção e prontos para envio.':'Entregas com dia e período definidos pelo cliente.'}<\/p>`)+`<div class="mf-controls"><select id="mf-status-filter" aria-label="Status do pedido"><option value="">Todos os status<\/option>${options(tab==='producao'?['Confirmado','Em produção','Pronto']:statuses,filter)}<\/select>${canSell()?btn('+ Venda manual','new-order','',true)+btn('Exportar CSV','export-orders'):''}<\/div>`+box(list.length+' pedidos',list.length?ordersRows(list):empty('Nenhum pedido encontrado','Altere o período ou aguarde um novo pedido.'));}
function productsView(){const q=query.toLowerCase(),list=D.products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(q));return `<div class="mf-controls"><input type="search" id="mf-search" value="${E(query)}" placeholder="Buscar produto ou categoria" aria-label="Buscar produto">${btn('+ Novo produto','new-product','',true)}${btn('Categorias','categories')}<span class="mf-hint">${D.products.length} produtos · alterações aparecem em outros dispositivos<\/span><\/div><div class="mf-products">${list.map(p=>`<article class="mf-pcard"><img src="${E(p.main_image)}" alt="${E(p.name)}" loading="lazy"><div class="mf-pcopy"><h3>${E(p.name)}<\/h3><p>${E(p.category)} · ${!p.active?'Oculto':p.available?'Disponível':'Indisponível'}<\/p><footer><b>${R(p.price)}<\/b>${btn('✎ Editar','product',`data-id="${E(p.id)}"`)}<\/footer><\/div><\/article>`).join('')}<\/div>${!list.length?empty('Nenhum produto'):''}`;}
function stockView(){return `<div class="mf-controls">${btn('+ Adicionar item','new-stock','',true)}<span class="mf-hint">Controle manual de flores, embalagens e materiais.<\/span><\/div>`+box('Materiais e insumos',D.stock.length?table(['Item','Quantidade','Mínimo','Situação',''],D.stock.map(x=>`<tr><td>${E(x.name)}<\/td><td>${E(x.quantity)} ${E(x.unit)}<\/td><td>${E(x.minimum)} ${E(x.unit)}<\/td><td>${badge(+x.quantity<=+x.minimum?'Pendente':'Disponível')}<\/td><td>${btn('Editar','stock',`data-id="${E(x.id)}"`)}<\/td><\/tr>`)):empty('Cadastre seus materiais','Acompanhe quantidades e receba destaques de estoque baixo.'));}
function finance(){const os=periodOrders(),income=D.receipts.filter(x=>within(x.day)),costs=D.expenses.filter(x=>within(x.day)),cash=income.reduce((s,x)=>s+number(x.amount),0),spent=costs.reduce((s,x)=>s+number(x.amount),0),owed=validOrders().reduce((s,o)=>s+dueTotal(o),0);let days={};income.forEach(x=>days[x.day]=(days[x.day]||0)+number(x.amount));const max=Math.max(1,...Object.values(days));return controls()+`<div class="mf-cards">${metric('Entradas reais',R(cash),'Recebimentos pelas datas registradas')}${metric('Despesas',R(spent),costs.length+' lançamentos')}${metric('Saldo do período',R(cash-spent),'Entradas menos despesas')}${metric('A receber',R(owed),'Saldo de todos os pedidos ativos')}<\/div><div class="mf-two">${box('Entradas por dia',Object.keys(days).length?'<div class="mf-list">'+Object.entries(days).sort().map(([d,n])=>`<div class="mf-list-row" style="display:block"><span>${date(d)} <b style="float:right">${R(n)}<\/b><\/span><div class="mf-progress"><i style="width:${Math.max(0,n/max*100)}%"><\/i><\/div><\/div>`).join('')+'<\/div>':empty('Sem entradas neste período'))}${box('Parcelas vencidas',overdue().length?'<div class="mf-list">'+overdue().map(({o,p})=>`<div class="mf-list-row"><span>${E(o.data.c)} · #MF-${o.id}<br><small>${date(p.due)} · ${R(p.amount)}<\/small><\/span>${btn('Ver pedido','order',`data-id="${o.id}"`)}<\/div>`).join('')+'<\/div>':empty('Nenhuma parcela vencida','Os vencimentos são destacados automaticamente.'))}<\/div>`+box('Movimentações',income.length?table(['Data','Pedido','Descrição','Valor'],income.slice().reverse().map(x=>`<tr><td>${date(x.day)}<\/td><td>#MF-${x.order_id}<\/td><td>${E(x.note||'Recebimento')}<\/td><td>${R(x.amount)}<\/td><\/tr>`)):empty('Nenhuma movimentação registrada'))+`<p class="mf-hint">O valor líquido esperado e os recebimentos são definidos em “Ver pedido”. O saldo não inclui valores ainda a receber. Custos de produção só entram no saldo quando lançados em Despesas.<\/p>`;}

function clientsView(){const map=new Map();validOrders().forEach(o=>{const key=String(o.data.t).replace(/\D/g,'');const c=map.get(key)||{name:o.data.c,phone:o.data.t,orders:0,total:0,last:o.created_at};c.orders++;c.total+=gross(o);if(o.created_at>c.last){c.last=o.created_at;c.name=o.data.c;}map.set(key,c);});const list=[...map.values()].filter(c=>(c.name+' '+c.phone).toLowerCase().includes(query.toLowerCase()));return `<div class="mf-controls"><input id="mf-search" type="search" value="${E(query)}" placeholder="Buscar cliente" aria-label="Buscar cliente"><span class="mf-hint">Clientes são organizados automaticamente pelos pedidos.<\/span><\/div>`+box('Seus clientes',list.length?table(['Cliente','Telefone','Pedidos','Total comprado','Último pedido',''],list.map(c=>`<tr><td>${E(c.name)}<\/td><td>${E(c.phone)}<\/td><td>${c.orders}<\/td><td>${R(c.total)}<\/td><td>${date(c.last)}<\/td><td><a class="mf-button" href="https://wa.me/${E(phoneDigits(c.phone))}" target="_blank" rel="noopener">WhatsApp ↗<\/a><\/td><\/tr>`)):empty('Sua lista de clientes começará aqui'));}

async function imageData(file){if(!file.type.startsWith('image/'))throw new Error('Escolha um arquivo de imagem.');const url=URL.createObjectURL(file);try{const img=new Image();img.src=url;await img.decode();const scale=Math.min(1,1100/img.width,1300/img.height),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/webp',.8);}finally{URL.revokeObjectURL(url);}}
async function addFiles(files){for(const f of files){if(editImages.length>=8){toast('Use até 8 fotos por produto.');break;}editImages.push(await imageData(f));}formDirty=true;renderImages();}

async function handleAction(el){const a=el.dataset.ma,id=el.dataset.id;if(!actionAllowed(a))return toast('Seu perfil não permite esta ação.');
 if(a==='new-user'||a==='edit-user')return openUser(el.dataset.username);
 if(a==='toggle-user'){if(!confirm((el.dataset.active==='true'?'Ativar':'Desativar')+' o acesso de '+el.dataset.username+'?'))return;await api('set_user_active',{username:el.dataset.username,active:el.dataset.active==='true'});await refresh();return toast('Acesso atualizado.');}
 if(a==='delete-order')return openDeleteOrder(id);
 if(a==='deleted-orders')return openDeletedOrders();
 if(a==='restore-order'){await api('restore_order',{id});await refresh();return openDeletedOrders();}
 if(a==='nav'){if(!allowedKeys().includes(el.dataset.tab))return;if(settingsDirty){if(!confirm('Descartar as configurações ainda não salvas?'))return;settingsDirty=false;}if(el.dataset.tab==='produtos')D.catalog_version='';location.hash='#sistema/'+el.dataset.tab;return;}
 if(a==='visit'){location.href=siteUrl;return;}
 if(a==='setup-toggle'){setup=!setup;return login();}
 if(a==='close-modal')return closeModal();
 if(a==='refresh'){D.catalog_version='';await refresh();toast('Dados atualizados.');return;}
 if(a==='logout'){await api('logout');clearSession();return login();}
 if(a==='product'||a==='new-product')return openProduct(id);
 if(a==='remove-image'){editImages.splice(+el.dataset.i,1);formDirty=true;return renderImages();}
 if(a==='image-url'){const v=$('[name=image_url]',modal).value.trim();if(!/^https:\/\//.test(v))return toast('Use uma URL de imagem começando com https://.');editImages.push(v);$('[name=image_url]',modal).value='';formDirty=true;return renderImages();}
 if(a==='delete-product'){if(!confirm('Excluir este produto do catálogo?'))return;await api('delete_product',{id});D.catalog_version='';closeModal(true);await refresh();return toast('Produto excluído.');}
 if(a==='categories')return openCategories();
 if(a==='delete-category'){if(!confirm('Excluir a categoria? Seus produtos serão movidos para Outros.'))return;await api('delete_category',{name:el.dataset.name});D.catalog_version='';await refresh();openCategories();return;}
 if(a==='stock'||a==='new-stock')return openStock(id);
 if(a==='expense'||a==='new-expense')return openExpense(id);
 if(a==='delete-stock'||a==='delete-expense'){if(!confirm('Excluir este registro?'))return;await api(a.replaceAll('-','_'),{id});closeModal(true);await refresh();return;}
 if(a==='order')return openOrder(id);
 if(a==='new-order')return openNewOrder();
 if(a==='print-order')return printOrder();
 if(a==='calculate-net'){const f=$('form[data-mf=order]',modal);f.elements.net.value=number(editOrder.subtotal)+number(f.elements.delivery_fee.value);formDirty=true;return;}
 if(a==='generate-installments'){const f=$('form[data-mf=order]',modal),n=Math.min(24,Math.max(1,parseInt($('#mf-install-count').value)||1)),total=Math.round(number(f.elements.net.value)*100),base=Math.floor(total/n);if($('#mf-installments').children.length&&!confirm('Substituir as parcelas atuais?'))return;const start=f.elements.received_day.value||today();$('#mf-installments').innerHTML=Array.from({length:n},(_,i)=>{const parts=start.split('-').map(Number),dt=new Date(Date.UTC(parts[0],parts[1]-1+i,1)),last=new Date(Date.UTC(dt.getUTCFullYear(),dt.getUTCMonth()+1,0)).getUTCDate();dt.setUTCDate(Math.min(parts[2],last));return installmentRow({amount:(base+(i===n-1?total-base*n:0))/100,due:dt.toISOString().slice(0,10),paid:false},i);}).join('');formDirty=true;return;}
 if(a==='add-installment'){$('#mf-installments').insertAdjacentHTML('beforeend',installmentRow());formDirty=true;return;}
 if(a==='remove-installment'){el.closest('.mf-installment').remove();formDirty=true;return;}
 if(a==='backup'){return exportFile('Manaus_Flores_Backup_'+today()+'.json',JSON.stringify({exported_at:new Date().toISOString(),...D},null,2),'application/json');}
 if(a==='export-orders'){const rows=[['Pedido','Cliente','Telefone','Data do pedido','Data agendada','Periodo','Forma','Produtos','Total','Recebido','Liquido esperado','Status'],...D.orders.filter(o=>within(dayOf(o.created_at))).map(o=>[o.id,o.data.c,o.data.t,dayOf(o.created_at),o.data.periodo_data,o.data.periodo,o.data.p,(o.data.itens||[]).map(x=>x.q+'x '+x.n).join(', '),gross(o),o.received,o.net,o.status])];const safe=x=>{let t=String(x??'');if(/^[=+@\-\t\r]/.test(t))t="'"+t;return '"'+t.replaceAll('"','""')+'"';};return exportFile('Pedidos_Manaus_'+today()+'.csv','\uFEFF'+rows.map(row=>row.map(safe).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
 if(a==='password')return showModal('Alterar minha senha',`<form class="mf-form" data-mf="password">${field('Senha atual','current','','password','required autocomplete="current-password"')}${field('Nova senha · mínimo 10 caracteres','password','','password','required minlength="10" autocomplete="new-password"')}${footer()}<\/form>`);
}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-ma]');if(!el)return;try{await handleAction(el);}catch(error){toast(message(error));}});
document.addEventListener('change',async e=>{const el=e.target;if(el.name==='role'&&el.closest('form[data-mf="user"]')){const help=$('#mf-role-help');if(help)help.textContent=el.value==='administrador'?'Acesso a todas as áreas.':ROLE_TABS[el.value].map(k=>tabs[k][0]).join(' · ');}if(el.id==='mf-range'){range=el.value;render();}else if(el.id==='mf-anchor'){anchor=el.value||today();render();}else if(el.id==='mf-status-filter'){filter=el.value;render();}else if(el.id==='mf-image-files'){try{await addFiles(el.files);}catch(error){toast(message(error));}}});
let searchTimer;document.addEventListener('input',e=>{if(e.target.closest('form[data-mf="settings"]'))settingsDirty=true;if(e.target.id!=='mf-search')return;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=e.target.value;const pos=e.target.selectionStart;$('#mf-view').innerHTML=({pedidos:orders,producao:orders,entregas:orders,produtos:productsView,clientes:clientsView}[tab])();const input=$('#mf-search');input?.focus();if(input&&input.type!=='search')input.setSelectionRange(pos,pos);},200);});
document.addEventListener('paste',async e=>{if(e.target.id!=='mf-paste-image')return;const files=Array.from(e.clipboardData?.items||[]).filter(x=>x.type.startsWith('image/')).map(x=>x.getAsFile());if(files.length){e.preventDefault();try{await addFiles(files);}catch(error){toast(message(error));}}});
document.addEventListener('submit',async e=>{const f=e.target;if(!f.dataset.mf)return;e.preventDefault();const submit=$('[type=submit]',f)||$('button:not([type=button])',f);if(submit?.disabled)return;const data=Object.fromEntries(new FormData(f)),type=f.dataset.mf;if(submit)submit.disabled=true;try{
 if(type==='login'||type==='activate'){const j=await MF_API(type,data);token=j.token;updateIdentity(j.me);try{sessionStorage.setItem('mf:session',token);}catch(_){}authed=true;setup=false;await refresh();toast('Acesso realizado.');return;}
 if(type==='delete-order'){await api('delete_order',{id:f.dataset.id,password:data.password});closeModal(true);await refresh();toast('Pedido apagado.');return;}
 if(type==='user'){await api('save_user',{username:data.username,name:data.name,role:f.elements.role.value,active:f.elements.active.checked,password:data.password,create:!editUser});closeModal(true);await refresh();toast('Usuário salvo.');return;}
 if(type==='operational'){await api('order_status',{id:editOrder.id,status:data.status,expected_updated_at:editOrder.updated_at});closeModal(true);await refresh();toast('Status atualizado.');return;}
 if(type==='product'){if(!editImages.length)throw new Error('Adicione pelo menos uma foto.');const p={...editProduct,...data,price:number(data.price),main_image:editImages[0],gallery_images:editImages.slice(1),available:f.elements.available.checked,active:f.elements.active.checked};delete p.image_url;await api('save_product',p);D.catalog_version='';await MF_API('catalog',{p_lim:100}).then(SF.setRows);}
 else if(type==='category'){await api('save_category',data);await refresh();openCategories();return;}
 else if(type==='stock')await api('save_stock',data);
 else if(type==='expense')await api('save_expense',data);
 else if(type==='settings'){if(!data.instagram.startsWith('https://'))throw new Error('Use um link https:// para o Instagram.');await api('save_settings',data);settingsDirty=false;await refresh();toast('Configurações salvas.');return;}
 else if(type==='password'){await api('password',data);}
 else if(type==='manual'){const v=number(data.subtotal),o={...data,itens:[{id:'manual',q:1,n:data.item,p:v}],loja:'mf',m:'',an:false};const id=await api('manual_order',{data:o,subtotal:v});await refresh();formDirty=false;openOrder(id);toast('Venda registrada.');return;}
 else if(type==='order'){const installments=$$('.mf-installment',f).map(row=>({amount:number($('[name=inst-amount]',row).value),due:$('[name=inst-due]',row).value,paid:$('[name=inst-paid]',row).checked}));const net=number(data.net);if(installments.length&&Math.abs(installments.reduce((s,p)=>s+p.amount,0)-net)>.011)throw new Error('A soma das parcelas deve ser igual ao líquido esperado.');let received=number(data.received);if(installments.length)received=number(installments.filter(p=>p.paid).reduce((s,p)=>s+p.amount,0));if(received>net+.001)throw new Error('O recebido não pode ser maior que o líquido esperado.');if(data.status==='Concluído'&&received+0.001<net&&!confirm('Este pedido ainda tem saldo a receber. Concluir mesmo assim?'))return;await api('save_order',{...data,id:editOrder.id,expected_updated_at:editOrder.updated_at,delivery_fee:data.delivery_fee===''?null:number(data.delivery_fee),net,received,installments});}
 closeModal(true);await refresh();toast('Alterações salvas na nuvem.');
 }catch(error){const el=$('#mf-login-error',f)||$('#mf-form-error',f);if(el){el.hidden=false;el.textContent=message(error);}else toast(message(error));}finally{if(submit)submit.disabled=false;}});
